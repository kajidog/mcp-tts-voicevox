version: 2

updates:
  # pnpm workspace: one entry for the root only. Dependabot reads
  # pnpm-workspace.yaml and covers every member manifest from here.
  # Listing the package directories individually makes it update a
  # sub-package's package.json without touching the root pnpm-lock.yaml,
  # and every such PR then fails CI with ERR_PNPM_OUTDATED_LOCKFILE.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The MCP SDK moves fast and its updates are worth reviewing alone.
      mcp:
        patterns:
          - '@modelcontextprotocol/*'
      # Everything else lands as one PR for the whole workspace.
      minor-and-patch:
        exclude-patterns:
          - '@modelcontextprotocol/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
